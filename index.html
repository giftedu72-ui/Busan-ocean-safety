<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087daf">
  <title>바다안전 부산</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --navy:#302b4b;--blue:#087daf;--sky:#f0eaff;--line:#ded7ef;
      --safe:#20b973;--care:#e7b900;--risk:#ee7a31;--stop:#ee5656;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f4f0ff 0%,#fbf9ff 52%,#f1ebff 100%);color:var(--navy);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
    button{font:inherit}
    .shell{max-width:1160px;margin:auto;padding:0 20px}
    header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .head{height:70px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;padding:0;font-weight:900;font-size:20px;cursor:pointer}
    .brand:hover,.brand:focus-visible{color:#087daf;outline:none}
    .brand-logo{width:42px;height:42px;object-fit:cover;border-radius:13px;display:block;background:#fff;box-shadow:0 2px 8px rgba(7,47,85,.12)}
    nav{display:flex;gap:5px}
    nav button,.back{border:0;background:transparent;color:#547180;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:800}
    nav button.on,nav button:hover,.back:hover{background:#e9f7fc;color:#087daf}
    .warning{background:#fff0e7;color:#b54b13;border-bottom:1px solid #ffd6bd}
    .warning .shell{padding-top:10px;padding-bottom:10px;font-size:14px;font-weight:800}
    .live-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:16px;color:#536f7b;font-size:13px;box-shadow:0 6px 18px rgba(47,39,82,.05)}
    .live-status b{color:#2c4660}.live-status small{margin-left:auto;color:#7b7294}
    .live-dot{width:9px;height:9px;border-radius:50%;background:#9aa9af;box-shadow:0 0 0 4px #edf1f3}
    .live-dot.on{background:var(--safe);box-shadow:0 0 0 4px #dcf6e9}
    main{padding:28px 0 48px}
    .page{animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:34px;margin-bottom:8px;letter-spacing:-1px}
    h2{font-size:24px;margin-bottom:16px;letter-spacing:-.5px}
    h3{font-size:17px;margin-bottom:9px}
    .sub{color:#6a8390;margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(4,67,93,.06)}
    .hero{grid-column:span 7;min-height:236px;background:linear-gradient(145deg,#3bb9df,#62c9e7);color:#fff;position:relative;overflow:hidden}
    .hero:after{content:"≈";position:absolute;right:18px;bottom:-75px;font-size:200px;line-height:1;color:rgba(255,255,255,.12)}
    .hero small{font-weight:800;opacity:.8}
    .hero h1{font-size:38px;margin:32px 0 12px}
    .hero p{max-width:490px;line-height:1.7;opacity:.95}
    .hero .badge{background:#fff;color:#d76422}
    .hero-alert-list{margin-top:14px;font-size:13px;font-weight:900;line-height:1.55}
    .recommend{grid-column:span 5}
    .recommend .pick{padding:15px 0;border-bottom:1px solid #e7eff2;display:flex;justify-content:space-between;gap:16px}
    .recommend .pick:last-child{border-bottom:0;padding-bottom:0}
    .recommend small,.muted{color:#78909b}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap}
    .badge:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
    .safe{background:#e2f8ed;color:#087e4a}.care{background:#fff6cb;color:#936f00}
    .risk{background:#ffeadc;color:#bb5015}.stop{background:#ffe3e3;color:#c72b2b}
    .beaches{grid-column:1/-1}
    .beach-list{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
    .beach{border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer;color:inherit}
    .beach:hover{border-color:#69bddc;transform:translateY(-2px)}
    .beach b{display:block;margin:11px 0 6px}
    .beach small{color:#69838e}
    .distance-list{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
    .distance-item{background:#f3fbfe;border:1px solid #d7edf4;border-radius:15px;padding:13px;text-align:center}
    .distance-item b{display:block;font-size:14px;margin-bottom:6px}.distance-item span{color:#087daf;font-weight:1000;font-size:17px}
    .primary{border:0;border-radius:14px;background:#087daf;color:white;padding:13px 18px;font-weight:900;cursor:pointer}
    .wide{width:100%;margin-top:16px}
    .map-toolbar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 7px 20px rgba(4,67,93,.05)}
    .map-toolbar-top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:13px}
    .map-toolbar h2{font-size:16px;margin:0}
    .map-legend{display:flex;gap:11px;flex-wrap:wrap;color:#587581;font-size:12px;font-weight:800}
    .map-legend span{display:inline-flex;align-items:center;gap:5px}
    .map-legend i{width:10px;height:10px;border-radius:50%;background:var(--legend);box-shadow:0 0 0 2px #fff,0 0 0 3px #cbdde4}
    .map-legend .connector-key{width:19px;height:0;border-top:2px dashed #dd5a3d;border-radius:0;background:transparent;box-shadow:none}
    .region-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
    .region-tabs button{border:1px solid var(--line);background:#f7fbfc;color:#496b78;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:13px;font-weight:900;cursor:pointer}
    .region-tabs button.on{background:#087daf;border-color:#087daf;color:#fff;box-shadow:0 4px 12px rgba(8,125,175,.22)}
    .map-layout{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:14px;align-items:stretch}
    .map{height:570px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#d8eef6;box-shadow:0 8px 24px rgba(4,67,93,.08)}
    .map-loading{height:100%;display:grid;place-items:center;color:#537887;font-weight:800}
    .map-source{text-align:right;color:#7b929d;font-size:12px;margin-top:8px}
    .safety-icon{background:transparent!important;border:0!important}
    .safety-marker-wrap{position:relative;width:42px;height:42px;filter:drop-shadow(0 4px 5px rgba(3,41,58,.35))}
    .safety-marker{width:42px;height:42px;border:4px solid #fff;border-radius:50%;background:var(--marker);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:1000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
    .safety-marker-label{position:absolute;left:49px;top:-2px;min-width:98px;white-space:nowrap;background:rgba(255,255,255,.98);border:1px solid #ded7ef;border-radius:11px;padding:5px 8px;color:#302b4b;box-shadow:0 3px 10px rgba(47,39,82,.18);line-height:1.15;transform:translateY(var(--label-shift-y,0));pointer-events:none}
    .safety-marker-label.top-right{left:51px;top:-41px}
    .safety-marker-label.top-left{left:auto;right:51px;top:-41px;text-align:right}
    .safety-marker-label.bottom-right{left:51px;top:31px}
    .safety-marker-label.bottom-left{left:auto;right:51px;top:31px;text-align:right}
    .safety-marker-label small{display:block;color:#718a95;font-size:9px;margin-bottom:2px}
    .safety-marker-label b{font-size:12px}
    .map-panel{height:570px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;overflow:auto;box-shadow:0 8px 24px rgba(4,67,93,.06)}
    .map-panel h2{font-size:18px;margin-bottom:5px}
    .map-panel>p{font-size:12px;color:#718995;line-height:1.5;margin-bottom:13px}
    .region-list{display:grid;gap:8px}
    .region-beach{width:100%;border:1px solid #deebf0;background:#f8fcfd;border-radius:14px;padding:12px;text-align:left;color:inherit;cursor:pointer}
    .region-beach:hover,.region-beach:focus-visible{border-color:#4cb1d5;background:#edf9fd;outline:none}
    .region-beach-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .region-beach small{color:#718995;font-weight:800}
    .region-beach b{display:block;font-size:14px;margin-bottom:5px}
    .region-beach em{font-style:normal;color:#587581;font-size:11px}
    .map-popup{min-width:205px;color:#123848}
    .map-popup b{display:block;font-size:16px;margin-bottom:8px}
    .map-popup small{display:block;color:#69838e;font-weight:800;margin-bottom:5px}
    .map-popup .badge{margin-bottom:8px}
    .map-popup p{line-height:1.6;margin:0 0 10px}
    .map-popup button{width:100%;border:0;border-radius:10px;background:#087daf;color:white;padding:9px;font-weight:900;cursor:pointer}
    .leaflet-popup-content-wrapper{border-radius:15px}
    .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
    .metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
    .metric span{display:block;color:#718995;font-size:13px;margin-bottom:7px}
    .metric b{font-size:22px}
    .cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
    .forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .forecast div{background:#f4fafc;padding:14px;border-radius:14px;text-align:center}
    .forecast b{display:block;margin:7px 0}
    .danger-note{background:#fff4ec;border:1px solid #ffd7bf;color:#9f4618;border-radius:16px;padding:16px;line-height:1.65}
    .facilities{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .facility{background:#f2f9fc;border-radius:14px;padding:14px;text-align:center}
    .facility-art{width:36px;height:36px;margin:0 auto 7px;display:grid;place-items:center;border-radius:12px;background:#dff3fb}
    .facility-art svg{width:28px;height:28px;display:block}
    button.facility{border:1px solid transparent;color:inherit;font:inherit;cursor:pointer}
    button.facility:hover,button.facility:focus-visible{border-color:#49afd1;background:#e7f8fd;outline:none}
    .parking-icon{background:transparent!important;border:0!important}
    .parking-pin{width:34px;height:34px;border:3px solid #fff;border-radius:11px;background:#2878c7;color:#fff;display:grid;place-items:center;font-weight:1000;box-shadow:0 4px 10px rgba(10,50,94,.35)}
    .hospital-pin{width:28px;height:28px;border:3px solid #fff;border-radius:50%;background:#df3039;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:1000;box-shadow:0 4px 10px rgba(104,25,34,.35)}
    .facility-pin{width:32px;height:32px;border:3px solid #fff;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:1000;box-shadow:0 4px 10px rgba(10,50,94,.35)}
    .activity-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .activity-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;color:#456775;font-weight:800;cursor:pointer}
    .activity-tabs button.on{background:#087daf;color:#fff;border-color:#087daf}
    .leisure-beach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 20px}
    .leisure-beach{position:relative;min-height:118px;border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px;text-align:left;color:#25384c;cursor:pointer;transition:.18s ease}
    .leisure-beach:hover,.leisure-beach:focus-visible{border-color:#38a7cc;background:#f3fbfe;outline:none;transform:translateY(-2px)}
    .leisure-beach.on{border:2px solid #087daf;background:#eaf8fd;box-shadow:0 8px 18px rgba(8,125,175,.14)}
    .leisure-beach b{display:block;font-size:15px;margin:11px 0 7px;line-height:1.35}
    .leisure-beach small{display:block;color:#66828f;font-weight:800;line-height:1.55}
    .leisure-beach .badge{font-size:11px;padding:5px 8px}
    .observation-source{display:inline-flex;align-items:center;gap:5px;margin-top:8px;border-radius:999px;padding:4px 7px;background:#eef5f8;color:#537887;font-size:10px;font-weight:900;line-height:1.25}
    .observation-source.nearby{background:#fff4d9;color:#8d6700}
    .leisure-selection{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 10px}
    .leisure-selection p{margin:0;color:#5a7682;font-weight:800}
    .activity-result{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
    .score{width:114px;height:114px;border-radius:50%;display:grid;place-items:center;background:#eaf8fd;border:10px solid #83cde6;font-size:28px;font-weight:900}
    .tips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .tip{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.55}
    .tip-art{flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#eef8fc}
    .tip-art svg{width:34px;height:34px;display:block}
    .guide-groups{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
    .guide-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(4,67,93,.06)}
    .guide-card.before{border-top:5px solid #087daf}.guide-card.rescue{border-top:5px solid #ee7a31}
    .guide-card-kicker{display:block;color:#087daf;font-size:12px;font-weight:900;margin-bottom:7px}
    .guide-card.rescue .guide-card-kicker{color:#c45a1d}
    .guide-steps{display:grid;gap:11px;margin-top:16px}
    .guide-step{display:grid;grid-template-columns:30px 1fr;gap:11px;align-items:start;padding:12px;background:#f5fafc;border-radius:14px;line-height:1.55}
    .guide-step strong{width:30px;height:30px;border-radius:10px;background:#dff3fb;color:#087daf;display:grid;place-items:center}
    .guide-card.rescue .guide-step strong{background:#ffeadc;color:#b95318}
    .rip-alert{background:linear-gradient(135deg,#fff3ea,#fff9f3);border:1px solid #ffd5bc;border-radius:22px;padding:22px;margin-bottom:16px}
    .rip-alert h2{color:#a94713;margin-bottom:8px}
    .rip-alert>p{color:#765344;line-height:1.65}
    .rip-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
    .rip-flow div{position:relative;background:#fff;border:1px solid #f0d7c8;border-radius:15px;padding:14px;line-height:1.5}
    .rip-flow b{display:block;color:#b95318;margin-bottom:5px}
    .official-links{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .official-links a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #b9dce9;background:#fff;color:#087daf;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:900}
    .official-links a:hover{background:#eaf8fd}
    .source-card{margin-top:16px;background:#eff9fc;border:1px solid #cfe9f2;border-radius:18px;padding:16px;color:#315d6e;font-size:14px;line-height:1.65}
    .sos-call{position:fixed;right:22px;bottom:22px;z-index:1100;width:154px;border:0;border-radius:20px;padding:12px 14px;background:linear-gradient(135deg,#ed3e48,#c9172a);color:#fff;box-shadow:0 10px 24px rgba(180,20,42,.34);cursor:pointer;text-align:left;font-weight:900;transition:.18s ease}
    .sos-call:hover,.sos-call:focus-visible{transform:translateY(-2px);outline:3px solid rgba(238,86,86,.26);outline-offset:3px}
    .sos-call strong{display:block;font-size:18px;letter-spacing:.2px}.sos-call small{display:block;margin-top:3px;font-size:11px;line-height:1.35;opacity:.94}
    .sos-call.armed{animation:sosPulse .8s ease-in-out infinite;background:linear-gradient(135deg,#ff6a49,#d62522)}
    @keyframes sosPulse{50%{box-shadow:0 0 0 10px rgba(238,86,86,.16),0 10px 24px rgba(180,20,42,.34)}}
    footer{position:static;background:transparent;color:#746e88;border-top:1px solid rgba(115,99,164,.18)}
    footer .shell{padding-top:20px;padding-bottom:24px;font-size:11px;line-height:1.65;text-align:center}
    footer strong{display:inline;color:#5f567d;margin-right:4px}
    @media(max-width:1050px) and (min-width:761px){
      .beach-list{grid-template-columns:repeat(4,minmax(0,1fr))}
      .leisure-beach-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(max-width:760px){
      .shell{padding-left:14px;padding-right:14px}.head{height:62px}.brand{font-size:18px}
      nav button{font-size:12px;padding:8px 6px}main{padding-top:18px}h1{font-size:27px}
      .hero,.recommend{grid-column:1/-1}.hero{min-height:230px}.hero h1{font-size:31px;margin-top:26px}
      .beach-list{display:flex;overflow:auto;padding-bottom:6px}.beach{min-width:172px}
      .distance-list{display:flex;overflow:auto;padding-bottom:6px}.distance-item{min-width:128px}
      .map-toolbar-top{display:block}.map-toolbar h2{margin-bottom:10px}.map-layout{grid-template-columns:1fr}
      .map{height:490px;border-radius:18px}.map-panel{height:auto;max-height:none}.region-list{display:flex;overflow-x:auto;padding-bottom:4px}.region-beach{min-width:205px}
      .safety-marker-label{min-width:84px;padding:4px 6px}.safety-marker-label small{display:none}.safety-marker-label b{font-size:11px}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .metric:last-child{grid-column:1/-1}.cols{grid-template-columns:1fr}
      .detail-head{display:block}.detail-head .badge{margin-top:8px}
      .facilities{grid-template-columns:1fr}.tips{grid-template-columns:1fr}
      .guide-groups{grid-template-columns:1fr}.rip-flow{grid-template-columns:1fr}
      .activity-result{grid-template-columns:1fr}.score{width:96px;height:96px}
      .leisure-beach-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.leisure-beach{min-height:108px;padding:13px}.leisure-beach b{font-size:14px}
      .sos-call{right:14px;bottom:14px;width:144px;border-radius:18px}
      footer .shell{font-size:10px;padding-top:16px;padding-bottom:20px}
    }
  </style>
</head>
<body>
  <header>
    <div class="shell head">
      <button class="brand" type="button" onclick="go('home')" aria-label="바다안전 부산 홈으로"><img class="brand-logo" src="./assets/busan-ocean-safety-logo.png" alt="">바다안전 부산</button>
      <nav aria-label="주요 메뉴">
        <button data-nav="home" onclick="go('home')">홈</button>
        <button data-nav="map" onclick="go('map')">지도</button>
        <button data-nav="activity" onclick="go('activity')">레저지수</button>
        <button data-nav="guide" onclick="go('guide')">안전수칙</button>
      </nav>
    </div>
  </header>
  <div class="warning"><div class="shell" id="warningBanner">⚠ 해양 안전정보를 불러오는 중입니다. 현장 통제를 꼭 확인하세요.</div></div>
  <main class="shell"><div id="app"></div></main>
  <button id="sosCall" class="sos-call" type="button" onclick="requestEmergencyCall()" aria-describedby="sosHelp">
    <strong>🆘 SOS · 119</strong>
    <small id="sosHelp">두 번 누르면 신고 화면으로 연결</small>
  </button>
  <footer>
    <div class="shell">
      <strong>시제품용 예시 기준으로 계산된 정보입니다.</strong>
      본 서비스의 정보는 참고용입니다. 실제 입수 가능 여부는 기상특보, 현장 통제 및 안전요원의 안내를 우선하여 확인하세요.
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const beaches = [
      {name:'해운대해수욕장',region:'해운대구',wave:1.5,wind:8.3,direction:'남동풍',temp:23,weather:{condition:'날씨 확인 중'},rip:'확인 중',ripAvailable:false,level:'위험',score:42,lat:35.1587,lng:129.1604,labelPosition:'top-left',stationCode:'TW_0062',stationName:'해운대해수욕장 관측부이'},

    function formatObservedAt(value){
      if(!value) return '관측 시각 확인 중';
      if(/Z$|[+-]\d{2}:\d{2}$/.test(String(value))){
        const date=new Date(value);
        if(!Number.isNaN(date.getTime())){
          return new Intl.DateTimeFormat('ko-KR',{
            timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',
            hour:'2-digit',minute:'2-digit',hourCycle:'h23'
          }).format(date);
        }
      }
      return String(value).replace('T',' ').replace(/:\d{2}(?:\.\d+)?(?:Z)?$/,'').slice(0,16);
    }

    function waveStage(waveHeight,wavePeriod=null){
      const period=Number(wavePeriod);
      if(waveHeight>=4 || (Number.isFinite(period) && period>=11)) return '위험';
      if(waveHeight>2 || (Number.isFinite(period) && period>8)) return '경계';
      if(waveHeight>=2 || (Number.isFinite(period) && period>=8)) return '주의';
      return '관심';
    }
    function windStage(windSpeed){
      if(windSpeed<=.4) return '1단계';
      if(windSpeed<=3.3) return '2단계';
      if(windSpeed<=7.9) return '3단계';
      if(windSpeed<=13.8) return '4단계';
      return '5단계';
    }
    // 실제 서비스에서는 관측기관의 공식 기준과 현장 통제 정보를 우선해야 합니다.
    function calculateSafetyLevel(waveHeight, windSpeed, ripRisk, leisureActivity, skillLevel='초보',wavePeriod=null){
      const waveRisk={관심:0,주의:1,경계:3,위험:5}[waveStage(waveHeight,wavePeriod)];
      const windRisk={1:0,2:0,3:1,4:3,5:5}[Number(windStage(windSpeed).replace('단계',''))];
      let risk = waveRisk+windRisk;
      risk += ripRisk==='위험'?5:ripRisk==='경계'?4:ripRisk==='주의'?2:ripRisk==='관심'?0:0;
      if(['패들보드','카약'].includes(leisureActivity) && windSpeed>=5) risk += 2;
      if(leisureActivity==='초보 서핑' || skillLevel==='초보') risk += waveHeight>=1?1:0;
      if(leisureActivity==='해변 산책') risk = Math.max(0,risk-4);
      return risk>=8?'입수 비추천':risk>=5?'위험':risk>=2?'주의':'안전';
    }

    function distanceKm(lat1,lng1,lat2,lng2){
      const rad=value=>value*Math.PI/180;
      const a=Math.sin(rad(lat2-lat1)/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(rad(lng2-lng1)/2)**2;
      return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    function closestBeach(){
      if(!userLocation) return null;
      return beaches.map(beach=>({...beach,distance:distanceKm(userLocation.lat,userLocation.lng,beach.lat,beach.lng)})).sort((a,b)=>a.distance-b.distance)[0];
    }

    async function loadNearbyHospitals(beachList){

        const payload=await response.json();

    async function loadNearbyFacility(target){

      const guideMarker=L.marker([beach.lat,beach.lng],{icon,title:`${beach.name} ${label} 안내 지점`}).addTo(mapInstance).bindPopup(`<div class="map-popup"><b>${isToilet?'🚻':'🛟'} ${beach.name} ${label}</b><p>해변 기준 안내 지점입니다. 정확한 시설 위치를 조회하는 중입니다.</p></div>`);
      facilityMarkers.push(guideMarker);
      if(status) status.textContent=`${beach.name} 주변 ${label}을 찾는 중입니다…`;
      try{
        const selector=isToilet?'["amenity"="toilets"]':'["emergency"="lifeguard"],["amenity"="lifeguard"]';
        const query=isToilet?`[out:json][timeout:20];(node(around:3500,${beach.lat},${beach.lng})${selector};way(around:3500,${beach.lat},${beach.lng})${selector};);out center 20;`:`[out:json][timeout:20];(nwr(around:3500,${beach.lat},${beach.lng})["emergency"="lifeguard"];nwr(around:3500,${beach.lat},${beach.lng})["amenity"="lifeguard"];);out center 20;`;
        const response=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query),{signal:AbortSignal.timeout(12000)});
        if(!response.ok) throw new Error('시설 조회 실패');
        const payload=await response.json();
        if(mapInstance!==mapAtStart) return;
        if(places.length){ facilityMarkers.forEach(marker=>marker.remove()); facilityMarkers=[]; }
        const places=(payload.elements||[]).map(item=>({lat:Number(item.lat??item.center?.lat),lng:Number(item.lon??item.center?.lon),name:item.tags?.name||label})).filter(item=>Number.isFinite(item.lat)&&Number.isFinite(item.lng)).slice(0,20);

    function resolveLabelCollisions(){
      const target=document.getElementById('realMap');
      if(!target) return;
      const labels=[...target.querySelectorAll('[data-map-label]')];
      const positions=['top-left','top-right','bottom-left','bottom-right'];
      const occupied=[...target.querySelectorAll('.safety-marker')].map(marker=>marker.getBoundingClientRect());
      const mapRect=target.getBoundingClientRect();
      const shifts=[0,-18,18,-36,36,-54,54];
      const overlapArea=(a,b)=>{
        const width=Math.max(0,Math.min(a.right+5,b.right+5)-Math.max(a.left-5,b.left-5));
        const height=Math.max(0,Math.min(a.bottom+5,b.bottom+5)-Math.max(a.top-5,b.top-5));
        return width*height;
      };
      labels.forEach(label=>{
        const preferred=label.dataset.preferred||'top-right';
        const choices=[preferred,...positions.filter(position=>position!==preferred)];
        let bestPosition=preferred;
        let bestPenalty=Infinity;
        let bestShift=0;
        choices.forEach(position=>{
          shifts.forEach(shift=>{
            label.className='safety-marker-label '+position;
            label.style.setProperty('--label-shift-y',shift+'px');
            const rect=label.getBoundingClientRect();
            const overflow=
              Math.max(0,mapRect.left+6-rect.left)+
              Math.max(0,rect.right-(mapRect.right-6))+
              Math.max(0,mapRect.top+6-rect.top)+
              Math.max(0,rect.bottom-(mapRect.bottom-6));
            const collisions=occupied.reduce((sum,used)=>sum+overlapArea(rect,used),0);
            const movementCost=Math.abs(shift)*.2+(position===preferred?0:3);
            const penalty=(overflow*10000)+(collisions*100)+movementCost;
            if(penalty<bestPenalty){
              bestPenalty=penalty;
              bestPosition=position;
              bestShift=shift;
            }
          });
        });
        label.className='safety-marker-label '+bestPosition;
        label.style.setProperty('--label-shift-y',bestShift+'px');
        const finalRect=label.getBoundingClientRect();
        occupied.push({left:finalRect.left,right:finalRect.right,top:finalRect.top,bottom:finalRect.bottom});
      });
      drawRiskConnectors();
    }
    function drawRiskConnectors(){
      if(!mapInstance || !window.L) return;
      mapConnectors.forEach(connector=>connector.remove());
      mapConnectors=[];
      const target=document.getElementById('realMap');
      if(!target) return;
      const mapRect=target.getBoundingClientRect();
      target.querySelectorAll('[data-risk-connector="true"]').forEach(label=>{
        const marker=label.parentElement?.querySelector('.safety-marker');
        if(!marker) return;
        const labelRect=label.getBoundingClientRect();
        const markerRect=marker.getBoundingClientRect();
        const markerCenter={x:markerRect.left+markerRect.width/2,y:markerRect.top+markerRect.height/2};
        const labelEdge={
          x:markerCenter.x<labelRect.left?labelRect.left:markerCenter.x>labelRect.right?labelRect.right:labelRect.left+labelRect.width/2,
          y:Math.max(labelRect.top+7,Math.min(markerCenter.y,labelRect.bottom-7))
        };
        const toLatLng=point=>mapInstance.containerPointToLatLng([point.x-mapRect.left,point.y-mapRect.top]);
        const color=label.dataset.connectorColor||'#ee5656';
        mapConnectors.push(L.polyline([toLatLng(markerCenter),toLatLng(labelEdge)],{
          color,weight:2,opacity:.9,dashArray:'4 6',lineCap:'round',interactive:false
        }).addTo(mapInstance));
      });
    }

      },80);
    }

                </button>`).join('')}
            </div>
          </article>
          <div id="leisureResult" class="leisure-selection" style="margin-top:22px">
            <h2>${beach.name} 레저지수</h2>
            <p>${observationLabel(beach)}</p>
          </div>
          <div class="activity-tabs">${activities.map(item=>`<button class="${item===activity?'on':''}" onclick="chooseActivity('${item}')">${item}</button>`).join('')}</div>
          <article class="card activity-result">
            <div class="score">${score}점</div>
            <div>
              <small class="muted">오늘의 ${activity}</small>
              <h2 style="margin:6px 0">${status}</h2>
              ${badge(level)}
              <p style="margin-top:14px;line-height:1.7">${level==='안전'?'현재 조건에서는 비교적 편안하게 활동할 수 있어요. 그래도 지정 구역을 벗어나지 마세요.':level==='주의'?'바람과 물살 변화에 주의하세요. 혼자 멀리 나가지 말고 구명조끼를 착용하세요.':'파도 또는 이안류가 강해 활동하기 위험해요. 오늘은 입수를 미루고 해변 산책처럼 물에 들어가지 않는 활동을 권해요.'}</p>
            </div>
          </article>
          ${isNearbyObservation(beach)?`<div class="source-card"><b>인근 관측값 안내</b><br>${beach.name}에는 현재 이 앱이 연결한 전용 실시간 관측부이가 없어 <b>${beach.stationName.replace('인근 ','')}</b>의 관측값을 참고로 표시합니다. 따라서 같은 관측부이를 공유하는 해수욕장은 파고·풍속 수치가 같을 수 있으며, 실제 현장 상태와 차이가 날 수 있습니다.</div>`:''}
          <div class="source-card">이 안전지수 계산은 시제품을 위한 예시 로직입니다. 실제 활동 여부는 기상특보와 현장 안전요원의 판단을 우선하세요.</div>
        </section>`;
    }

    function guideView(){
      const tips=[
        ['vest','구명조끼를 착용하고 안전요원이 있는 지정 구역에서만 활동하세요.'],
        ['rocks','방파제와 갯바위는 갑작스러운 파도에 휩쓸릴 수 있으니 접근하지 마세요.'],
        ['family','어린이는 반드시 보호자와 함께 이동하고 손이 닿는 곳에 머물게 하세요.'],
        ['phone','사고가 발생하면 즉시 주변에 알리고 119 또는 해양경찰에 신고하세요.']
      ];
      const tipArt={
        vest:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 7l8 6 8-6 7 12-6 5v17H15V24l-6-5z" fill="#ff9d27" stroke="#b95514" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 13v28M15 24l9 6 9-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>',
        rocks:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 36c6-5 11 5 18 0s11 5 20-1" fill="none" stroke="#1e9bd0" stroke-width="3" stroke-linecap="round"/><path d="M10 31l7-11 8 3 4 8z" fill="#7b8794"/><path d="M25 31l7-15 8 5 3 10z" fill="#5f6d7b"/><path d="M11 31h31" stroke="#394858" stroke-width="2" stroke-linecap="round"/></svg>',
        family:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="13" r="5" fill="#1c95c8"/><circle cx="33" cy="16" r="4" fill="#ffaf3d"/><path d="M8 39v-9c0-5 4-9 8-9s8 4 8 9v9M27 39v-8c0-4 3-7 6-7s7 3 7 7v8" fill="#7ed1e8" stroke="#087daf" stroke-width="2.3" stroke-linejoin="round"/><path d="M16 26v13M33 29v10" stroke="#087daf" stroke-width="2.3" stroke-linecap="round"/></svg>',
        phone:'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="5" width="28" height="38" rx="6" fill="#fff" stroke="#df4049" stroke-width="2.8"/><path d="M18 14c2-2 4 4 6 4s4-6 6-4l3 4c-2 6-10 13-16 14l-3-4c-2-2 3-4 4-6s-6-4-4-6z" fill="#df4049"/><path d="M18 37h12" stroke="#df4049" stroke-width="2.5" stroke-linecap="round"/></svg>'
      };
      return `
        <section class="page">
          <h1>바다·해수욕장 행동요령</h1>
          <p class="sub">입수 전 확인부터 파도와 이안류에 휩쓸렸을 때의 행동까지 순서대로 확인하세요.</p>
          <div class="guide-groups">
            <article class="guide-card before">
              <span class="guide-card-kicker">입수 전</span>
              <h2>이상 파도와 조류 시간을 먼저 확인해요</h2>
              <div class="guide-steps">
                <div class="guide-step"><strong>1</strong><span>너울이나 이안류처럼 평소와 다른 파도가 보이거나 입수 통제가 있으면 물에 들어가지 마세요.</span></div>
                <div class="guide-step"><strong>2</strong><span>간조·만조 전후에는 물살과 파도 상태가 달라질 수 있어요. 출발 전에 조석·조류 변화 시간을 확인하세요.</span></div>
                <div class="guide-step"><strong>3</strong><span>현장의 안전 깃발, 안내방송과 안전요원의 지시를 가장 먼저 따르세요.</span></div>
              </div>
            </article>
            <article class="guide-card rescue">
              <span class="guide-card-kicker">익수·표류 시</span>
              <h2>힘으로 파도와 싸우지 말고 떠 있어요</h2>
              <div class="guide-steps">
                <div class="guide-step"><strong>1</strong><span>당황해 버둥대지 말고 호흡을 가다듬어 몸을 띄운 뒤, 손을 흔들어 구조를 요청하세요.</span></div>
                <div class="guide-step"><strong>2</strong><span>거센 파도에 밀렸다면 파도를 정면으로 거슬러 체력을 쓰지 말고, 강한 흐름을 벗어난 뒤 안전한 해안으로 비스듬히 이동하세요.</span></div>
                <div class="guide-step"><strong>3</strong><span>다른 사람이 빠졌다면 직접 뛰어들지 말고 구명환·로프를 사용하며 즉시 신고하세요.</span></div>
              </div>
            </article>
          </div>
          <article class="rip-alert">
            <h2>이안류에 휩쓸렸다면</h2>
            <p><b>육지를 향해 정면으로 필사적으로 헤엄치지 마세요.</b> 이안류보다 사람이 빠르게 수영하기 어려워 체력이 먼저 떨어질 수 있습니다.</p>
            <div class="rip-flow">
              <div><b>① 침착하게 뜨기</b>호흡을 유지하고 손을 흔들어 주변에 구조를 요청해요.</div>
              <div><b>② 흐름 옆으로 벗어나기</b>수영할 수 있다면 물살의 옆 방향, 즉 해변과 나란한 방향으로 이동해요.</div>
              <div><b>③ 해안으로 돌아오기</b>강한 흐름에서 벗어난 뒤 대각선 방향으로 안전한 해안에 접근해요.</div>
            </div>
          </article>
          <div class="tips">${tips.map(tip=>`<div class="tip"><span class="tip-art">${tipArt[tip[0]]}</span><b>${tip[1]}</b></div>`).join('')}</div>
          <div class="source-card">
            <b>공식 안전자료 확인</b><br>행동요령은 국민안전24와 해양경찰청 자료를 바탕으로 쉬운 문장으로 정리했습니다. 실제 상황에서는 현장 안전요원의 지시를 우선하세요.
            <div class="official-links">
              <a href="https://www.safekorea.go.kr/safekorea-kor/acts/nacts/action-guide.do?actsHeaderTitle=%EC%97%AC%EB%A6%84%EC%B2%A0%EB%AC%BC%EB%86%80%EC%9D%B4&category=summerWaterPlay&menuSn=4" target="_blank" rel="noopener">국민안전24 행동요령 ↗</a>
              <a href="https://www.kcg.go.kr/kcg/na/ntt/selectNttInfo.do?nttSn=50003" target="_blank" rel="noopener">해양경찰 안전영상 ↗</a>
              <a href="https://www.khoa.go.kr/oceangrid/gis/category/observe/observeSearch.do" target="_blank" rel="noopener">바다누리 조석·조류 확인 ↗</a>
            </div>
          </div>
        </section>`;
    }

    function render(){
      if(mapInstance && view!=='map'){
        mapInstance.remove();
        mapInstance=null;
      }
      document.querySelectorAll('[data-nav]').forEach(button=>button.classList.toggle('on',button.dataset.nav===view));
      const app=document.getElementById('app');
      app.innerHTML=view==='home'?homeView():view==='map'?mapView():view==='detail'?detailView():view==='activity'?activityView():guideView();
      if(view==='map') setTimeout(initMap,0);
    }
    render();
    updateWarning();
    loadLiveData();
    setInterval(loadLiveData,10*60*1000);
  </script>
</body>
</html>
