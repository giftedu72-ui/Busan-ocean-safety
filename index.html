<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다안전 부산</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf8fd;color:#133047;font-family:Arial,'Apple SD Gothic Neo',sans-serif}#app{max-width:520px;margin:auto;min-height:100vh;background:white;padding-bottom:115px}header{padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:19px;color:#0877cc}.brand small{display:block;font-size:10px;color:#7b919d;margin-top:4px}.warn{background:#fff0da;color:#a85000;padding:11px 20px;font-size:12px}.page{padding:24px 20px}.eyebrow,.sub{color:#718793;font-size:12px;margin:0 0 8px}h1{font-size:29px;line-height:1.25;margin:0 0 18px;letter-spacing:-1.5px}h1 em{color:#0877cc;font-style:normal}.hero{padding:22px;border-radius:23px;background:linear-gradient(135deg,#0878cc,#19afd3);color:white}.hero p{margin:0;font-size:12px;opacity:.85}.hero h2{font-size:21px;margin:6px 0}.hero span{font-size:12px}.plan{margin-top:14px;padding:15px;border:1px solid #d9eef0;background:#f0fbfa;border-radius:17px;font-size:13px;line-height:1.5}.plan b{display:block;font-size:16px;color:#0877cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.box,.row{border:0;text-align:left;background:#f1f8fd;border-radius:16px;padding:14px;color:inherit}.box b,.box span{display:block}.box span,.row small{font-size:11px;color:#667e8b}.title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 7px}.title h2{font-size:18px;margin:0}.title button,.back{color:#0877cc;font-size:12px}.row{width:100%;border-radius:0;background:white;border-bottom:1px solid #eaf0f2;display:flex;align-items:center;gap:10px}.row>div{flex:1}.row b{display:block;font-size:14px}.badge{font-size:11px;padding:5px 8px;border-radius:99px;font-weight:bold}.safe{background:#dcf7e9;color:#087846}.caution{background:#fff6c9;color:#9c7100}.danger{background:#ffeadf;color:#c75a19}.avoid{background:#ffe2e2;color:#c33535}.map{height:420px;border-radius:24px;background:linear-gradient(135deg,#bfeafb,#72c9eb);position:relative;overflow:hidden}.land{position:absolute;inset:5% 15% 9% 2%;border-radius:50% 40% 55% 35%;background:#e6efcf;display:grid;place-items:center;color:#84926a;transform:rotate(-8deg)}.pin{position:absolute;border:3px solid white;border-radius:50% 50% 50% 0;width:20px;height:20px;transform:rotate(-45deg);box-shadow:0 2px 6px #3458}.pin span{position:absolute;transform:rotate(45deg);top:17px;left:-12px;background:white;padding:3px 5px;border-radius:5px;font-size:10px;white-space:nowrap}.pin.safe{background:#20b973}.pin.caution{background:#e7b900}.pin.danger{background:#ee7a31}.pin.avoid{background:#ee5656}.answer{padding:16px;border-radius:17px;margin:14px 0 24px;line-height:1.5}.answer b{display:block;margin-bottom:5px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px;border:1px solid #e3edf0;border-radius:14px}.metric small,.metric b{display:block}.metric small{font-size:11px;color:#718793}.metric b{font-size:16px;margin-top:4px}.activities{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.activities button{border:0;border-radius:20px;padding:9px 10px;background:#eef4f6;color:#54707f;font-size:12px}.activities button.on{background:#0877cc;color:white}.guide{padding:15px 0;border-bottom:1px solid #e8eef1;font-size:14px;line-height:1.5}.emergency{margin-top:22px;padding:15px;background:#eaf7ff;border-radius:14px;color:#0877cc;text-align:center;font-weight:bold}nav{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);width:min(520px,100%);height:64px;background:white;border-top:1px solid #e4edf1;display:flex;justify-content:space-around;padding:9px}nav button{border:0;background:none;color:#7a909a;font-size:11px}nav button.on{color:#0877cc;font-weight:bold}footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#10374f;color:#dcebf1;padding:8px 15px;text-align:center;font-size:9px;line-height:1.45}
</style><body><div id="app"></div><script>
const beaches=[['해운대해수욕장',1.5,8.3,'남동풍',23,'높음','위험',42,71,28],['송정해수욕장',1.8,9.1,'동풍',22,'매우 높음','입수 비추천',22,86,18],['광안리해수욕장',.8,4.5,'남풍',24,'보통','주의',68,56,47],['다대포해수욕장',.5,3.2,'서풍',24,'낮음','안전',88,22,75],['송도해수욕장',.9,5.1,'남서풍',23,'보통','주의',64,39,61]];let view='home',sel=beaches[0],act='일반 물놀이';const cls=x=>x==='안전'?'safe':x==='주의'?'caution':x==='위험'?'danger':'avoid';const badge=x=>`<span class="badge ${cls(x)}">${x}</span>`;function safety(b,a){let r=Math.max(b[1]>=1.7?3:b[1]>=1.2?2:b[1]>=.7?1:0,b[2]>=8.5?3:b[2]>=7?2:b[2]>=4?1:0,{낮음:0,보통:1,높음:2,'매우 높음':3}[b[5]]);if(['패들보드','카약','초보 서핑'].includes(a))r++;if(a==='숙련 서핑')r--;if(a==='해변 산책')r--;return ['안전','주의','위험','입수 비추천'][Math.max(0,Math.min(3,r))]}function go(v){view=v;render()}function detail(i){sel=beaches[i];go('detail')}function render(){let c='';if(view==='home')c=`<section class="page"><p class="eyebrow">7월 28일 · 오전 10:30 기준</p><h1>오늘의 바다,<br><em>어떻게 즐길까요?</em></h1><div class="hero"><p>부산 바다 컨디션 브리핑</p><h2>주의가 필요해요</h2><span>물놀이는 다대포에서, 해운대 입수는 미뤄주세요</span></div><div class="plan"><b>✦ 오늘의 바다 플랜</b>오전에는 해변 산책 · 오후에는 다대포 얕은 물놀이를 추천해요.</div><div class="grid"><button class="box" onclick="detail(0)"><span>가장 가까운 해수욕장</span><b>해운대</b>${badge('위험')}</button><button class="box" onclick="detail(3)"><span>오늘 가장 안전한 곳</span><b>다대포</b>${badge('안전')}</button></div><div class="title"><h2>내 주변 해수욕장</h2><button onclick="go('map')">지도 보기 →</button></div>${beaches.map((b,i)=>`<button class="row" onclick="detail(${i})"><div><b>${b[0]}</b><small>파고 ${b[1]}m · 바람 ${b[2]}m/s</small></div>${badge(b[6])} ›</button>`).join('')}</section>`;if(view==='map')c=`<section class="page"><button class="back" onclick="go('home')">← 홈으로</button><h1>부산 해수욕장 지도</h1><p class="sub">마커를 누르면 상세 정보를 볼 수 있어요.</p><div class="map"><div class="land">부산광역시</div>${beaches.map((b,i)=>`<button class="pin ${cls(b[6])}" style="left:${b[8]}%;top:${b[9]}%" onclick="detail(${i})"><span>${b[0].replace('해수욕장','')}</span></button>`).join('')}</div></section>`;if(view==='detail'){let l=safety(sel,act),reason=l==='안전'?'기본 안전장비를 챙기고 현장 안내를 확인하세요.':l==='주의'?'혼자 활동하지 말고, 해안 가까이에서 짧게 즐기세요.':'파도·바람 또는 이안류가 강합니다. 오늘은 다른 활동을 선택하세요.';c=`<section class="page"><button class="back" onclick="go('home')">← 돌아가기</button><h1>${sel[0]}<br><em>현재 바다 상태</em></h1><div class="answer ${cls(sel[6])}"><b>${sel[6]} · ${sel[6]==='안전'?'오늘은 비교적 편안해요':'오늘은 조심해야 해요'}</b>이안류 위험도 ${sel[5]} · 현장 안전요원의 안내를 확인하세요.</div><div class="title"><h2>바다 한눈에 보기</h2></div><div class="metrics"><div class="metric"><small>파고</small><b>${sel[1]}m</b></div><div class="metric"><small>풍속</small><b>${sel[2]}m/s</b></div><div class="metric"><small>풍향</small><b>${sel[3]}</b></div><div class="metric"><small>수온</small><b>${sel[4]}°</b></div></div><div class="title"><h2>나에게 맞는 바다 플랜</h2></div><p class="sub">하려는 활동을 고르면 오늘의 바다가 답해드려요.</p><div class="activities">${['일반 물놀이','초보 서핑','숙련 서핑','패들보드','카약','해변 산책'].map(a=>`<button class="${a===act?'on':''}" onclick="act='${a}';render()">${a}</button>`).join('')}</div><div class="answer ${cls(l)}"><b>${act} · ${l==='안전'?'가능':l==='주의'?'주의':'비추천'}</b>${reason}</div><div class="title"><h2>편의·안전 시설</h2></div><div class="plan">🛟 가까운 구조대 &nbsp; 🚻 화장실 &nbsp; 🅿 주차장</div></section>`}if(view==='guide')c=`<section class="page"><h1>안전 행동요령</h1><p class="sub">바다에서는 조심하는 선택이 가장 좋은 선택입니다.</p>${['입수 금지 또는 비추천 표시는 반드시 따라주세요.','현장 안전요원의 안내와 통제선을 확인하세요.','방파제와 갯바위에는 접근하지 마세요.','어린이는 반드시 보호자와 함께 이동하세요.','사고가 나면 119 또는 해양경찰에 신고하세요.','이안류에 휩쓸리면 해안과 평행하게 이동하세요.'].map((x,i)=>`<div class="guide"><b>${i+1}. </b>${x}</div>`).join('')}<div class="emergency">긴급 상황 · 119 / 해양경찰 122</div></section>`;document.querySelector('#app').innerHTML=`<header><div class="brand">◒ 바다안전 부산<small>부산 해수욕장 레저 안전 플래너</small></div><span>⌖</span></header><div class="warn">⚠ 오늘 일부 해수욕장은 이안류 위험이 높아요.</div>${c}<nav><button class="${view==='home'?'on':''}" onclick="go('home')">⌂<br>홈</button><button class="${view==='map'?'on':''}" onclick="go('map')">⌖<br>지도</button><button class="${view==='detail'?'on':''}" onclick="detail(0)">◈<br>해수욕장</button><button class="${view==='guide'?'on':''}" onclick="go('guide')">☷<br>안전수칙</button></nav><footer>본 서비스의 정보는 참고용입니다. 실제 입수 가능 여부는 기상특보, 현장 통제 및 안전요원의 안내를 우선하여 확인하세요.<br>안전지수는 시제품용 예시 기준입니다.</footer>`}render();
</script></body></html>
