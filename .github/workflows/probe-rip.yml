name: Probe rip current beach codes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/probe-rip-codes.mjs
        env:
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}
